<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Онлайн-деканат — предварительная проверка студенческих документов">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16285A"/>
      <stop offset="0.55" stop-color="#2A4C99"/>
      <stop offset="1" stop-color="#3D6BD1"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1430" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="24" fill="url(#grid)"/>
  <circle cx="1180" cy="-30" r="190" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="60" cy="400" r="160" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- текст -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="72" y="92" font-size="18" letter-spacing="3" fill-opacity="0.75">UMIR 3 · КЕЙС «ЦЕНТР-ИНВЕСТ»</text>
    <text x="70" y="168" font-size="68" font-weight="800">Онлайн-деканат</text>
    <text x="72" y="214" font-size="24" fill-opacity="0.9">Загрузил справку, задал вопрос — получил ответ</text>
    <text x="72" y="246" font-size="24" fill-opacity="0.9">со ссылкой на пункт Положения. Без облаков.</text>

    <g font-size="17" font-weight="600">
      <rect x="72" y="284" width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="96" y="310">🔒 100% локально</text>
      <rect x="282" y="284" width="180" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="306" y="310">🎯 1.0 · 1.0 · 1.0</text>
      <rect x="476" y="284" width="232" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="500" y="310">✍️ печать по пикселям</text>
    </g>
  </g>

  <!-- лист документа -->
  <g transform="translate(905 34) scale(0.9) rotate(4)" filter="url(#shadow)">
    <rect width="300" height="300" rx="12" fill="#FFFFFF"/>
    <rect x="28" y="30" width="150" height="10" rx="5" fill="#1B2A4A" fill-opacity="0.85"/>
    <rect x="28" y="54" width="220" height="7" rx="3.5" fill="#1B2A4A" fill-opacity="0.18"/>
    <g fill="#1B2A4A" fill-opacity="0.32">
      <rect x="28" y="84" width="96" height="7" rx="3.5"/><rect x="132" y="84" width="120" height="7" rx="3.5" fill="#2A4C99" fill-opacity="0.55"/>
      <rect x="28" y="106" width="78" height="7" rx="3.5"/><rect x="114" y="106" width="104" height="7" rx="3.5" fill="#2A4C99" fill-opacity="0.55"/>
      <rect x="28" y="128" width="110" height="7" rx="3.5"/><rect x="146" y="128" width="70" height="7" rx="3.5" fill="#2A4C99" fill-opacity="0.55"/>
      <rect x="28" y="150" width="88" height="7" rx="3.5"/><rect x="124" y="150" width="96" height="7" rx="3.5" fill="#2A4C99" fill-opacity="0.55"/>
    </g>
    <!-- подсветка найденного поля -->
    <rect x="22" y="122" width="200" height="19" rx="5" fill="none" stroke="#F2A93B" stroke-width="2.5"/>
    <!-- подпись -->
    <rect x="28" y="232" width="70" height="7" rx="3.5" fill="#1B2A4A" fill-opacity="0.32"/>
    <path d="M110 238 c10 -22 18 8 26 -6 s12 -16 18 2 s10 6 22 -8" fill="none" stroke="#2443B8" stroke-width="3" stroke-linecap="round"/>
    <!-- печать -->
    <g transform="translate(232 238)">
      <circle r="38" fill="none" stroke="#2443B8" stroke-width="3" stroke-opacity="0.85"/>
      <circle r="28" fill="none" stroke="#2443B8" stroke-width="1.5" stroke-opacity="0.7"/>
      <text text-anchor="middle" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2443B8" fill-opacity="0.85">М.П.</text>
    </g>
  </g>

  <!-- вердикт -->
  <g transform="translate(772 284)" filter="url(#shadow)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect width="236" height="76" rx="14" fill="#FFFFFF"/>
    <circle cx="36" cy="38" r="18" fill="#1F9D63"/>
    <path d="M27 38 l6 6 l12 -13" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="34" font-size="17" font-weight="700" fill="#16285A">document_ok</text>
    <text x="66" y="56" font-size="14" fill="#56627A">rule:5.1 · 5.2 · 5.3</text>
  </g>
</svg>
