# Запуск одной командой: docker compose up -d --build  ->  http://localhost:8000
#
# Проще всего через скрипты рядом: start.cmd (Windows, двойной клик), ./start.sh (Linux/macOS).
# Пользователи, история и секрет JWT лежат в томе umir-data, так что пересборка и
# перезапуск их не сносят. Настройки (ключи Яндекса, демо-аккаунт и т.п.) берём из .env,
# образец — .env.example. Без .env всё тоже заводится с настройками по умолчанию.
#
# Мини-LLM для помощника (Qwen2.5-1.5B, ~1 ГБ) start.cmd / start.sh качают сами при
# первом запуске в models/llm, отсюда она монтируется в контейнер. Руками то же самое:
#   python -m backend.scripts.download_llm
# Не нужна — пропишите UMIR_LLM=0 в .env, помощник будет отвечать фрагментами из справки.

# имя проекта фиксируем, чтобы том с данными назывался одинаково, как бы ни звалась папка
name: umir-dean

services:
  dean:
    build: .
    image: umir-dean:latest
    container_name: umir-dean
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      UMIR_DATA_DIR: /app/var
    volumes:
      - umir-data:/app/var
      - ./models/llm:/app/models/llm:ro
    restart: unless-stopped
    mem_limit: ${MEMORY:-3g}

volumes:
  umir-data:
