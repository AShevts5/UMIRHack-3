# База ответов AI-помощника про само приложение. Ответ помощник ищет локально
# (backend/app/services/assistant.py), во внешние LLM не ходит.
# Про вузы ответы тянем из configs/universities/*.yaml, про проверку — из rules.md.
#
# Формат записи: id, questions (как могут спросить), keywords (доп. слова), answer, links.

suggestions:
  - "Как проверить документ?"
  - "Как войти через Яндекс?"
  - "Как включить двухфакторную аутентификацию?"
  - "Где деканат моего факультета?"
  - "Как выбрать свой вуз на карте?"
  - "Что делать, если не приходит код подтверждения?"

items:
  - id: check-document
    questions:
      - "Как проверить документ?"
      - "Как подать обращение в деканат?"
      - "Как загрузить справку или заявление?"
    keywords: [проверка, загрузить, файл, скан, фото, справка, заявление, обращение]
    answer: >
      Откройте в холле раздел «Обращение в деканат» и перетащите файл (PNG, JPG или
      одностраничный PDF до 12 МБ). Сервис распознает текст на этом компьютере, заполнит
      карточку полей и проверит обязательные сведения по Положению. Окончательное решение
      всё равно принимает сотрудник деканата.
    links:
      - { label: "Обращение в деканат", route: "#/dean" }

  - id: document-types
    questions:
      - "Какие документы поддерживаются?"
      - "Какие типы документов поддерживаются?"
    keywords: [типы, виды, поддерживаются, справка об обучении, академический отпуск, практика]
    answer: >
      Сейчас поддерживаются три типа: справка об обучении, заявление на академический
      отпуск и справка о прохождении практики. Тип определяется автоматически, его можно
      поменять вручную. Новый тип добавляется через конфиг document_types.yaml без кода.
    links:
      - { label: "Обращение в деканат", route: "#/dean" }

  - id: register
    questions:
      - "Как зарегистрироваться?"
      - "Как создать аккаунт?"
    keywords: [регистрация, аккаунт, учётная запись, новый пользователь]
    answer: >
      На экране входа нажмите «Зарегистрироваться», укажите логин или email и пароль не
      короче 8 символов. Можно сразу войти через Яндекс ID, тогда пароль не нужен.
    links:
      - { label: "Экран входа", route: "#/login" }

  - id: login
    questions:
      - "Как войти в личный кабинет?"
      - "Как войти в приложение?"
    keywords: [вход, войти, логин, пароль, кабинет, профиль]
    answer: >
      Введите логин или email и пароль на экране входа или нажмите «Войти через Яндекс».
      Если включена двухфакторная аутентификация, после пароля приложение попросит
      шестизначный код из приложения-аутентификатора.
    links:
      - { label: "Экран входа", route: "#/login" }

  - id: yandex
    questions:
      - "Как войти через Яндекс?"
      - "Не работает вход через Яндекс"
    keywords: [яндекс, oauth, яндекс id]
    answer: >
      Нажмите «Войти через Яндекс»: откроется страница Яндекс ID, после подтверждения вы
      вернётесь в приложение уже авторизованным. Если кнопка пишет, что вход не настроен,
      значит на сервере не заданы ключи приложения Яндекса (UMIR_YANDEX_CLIENT_ID и
      UMIR_YANDEX_CLIENT_SECRET) — войдите по логину и паролю.
    links:
      - { label: "Экран входа", route: "#/login" }

  - id: yandex-link
    questions:
      - "Как привязать Яндекс ID к аккаунту?"
      - "Как отвязать Яндекс?"
    keywords: [привязать, отвязать, привязка, яндекс, аккаунт]
    answer: >
      В профиле есть блок «Яндекс ID»: «Привязать Яндекс ID» откроет Яндекс, после
      подтверждения вы вернётесь в профиль, и входить можно будет в один клик. Отвязать можно
      там же, если у аккаунта есть пароль — иначе после отвязки войти будет нельзя.
    links:
      - { label: "Профиль", route: "#/profile" }

  - id: two-factor
    questions:
      - "Как включить двухфакторную аутентификацию?"
      - "Что такое 2FA?"
      - "Как настроить вход по коду?"
    keywords: [двухфакторная, 2fa, двухэтапная, аутентификатор, totp, защита]
    answer: >
      Откройте профиль (кнопка с вашим именем в шапке) и нажмите «Включить 2FA».
      Отсканируйте QR-код приложением-аутентификатором (Яндекс Ключ, Google Authenticator
      и подобные) и введите шестизначный код. После этого при входе понадобится и пароль, и код.
    links:
      - { label: "Профиль", route: "#/profile" }

  - id: code-missing
    questions:
      - "Что делать, если не приходит код подтверждения?"
      - "Код не подходит"
    keywords: [код, подтверждения, не приходит, не подходит, неверный]
    answer: >
      Код не приходит по SMS или почте — он появляется в приложении-аутентификаторе на
      телефоне и меняется каждые 30 секунд. Если код не подходит, проверьте, что время на
      телефоне выставлено автоматически, и введите свежий код.
    links:
      - { label: "Профиль", route: "#/profile" }

  - id: forgot-password
    questions:
      - "Забыл пароль"
      - "Как восстановить пароль?"
    keywords: [забыл, восстановить, сброс, пароль]
    answer: >
      Нажмите «Забыли пароль?» на экране входа и укажите логин или email. Ссылку для
      сброса выдаст администратор.
    links:
      - { label: "Экран входа", route: "#/login" }

  - id: change-password
    questions:
      - "Как сменить пароль?"
      - "Как задать пароль, если вхожу через Яндекс?"
    keywords: [сменить, поменять, изменить, задать, новый, пароль, профиль]
    answer: >
      Откройте профиль (кнопка с вашим именем вверху) и блок «Сменить пароль»: введите текущий
      пароль и дважды новый, от 8 символов. Если вы входили только через Яндекс ID, там будет
      «Задать пароль» — текущий не нужен, и после этого можно входить и по логину.
    links:
      - { label: "Профиль", route: "#/profile" }

  - id: map
    questions:
      - "Как выбрать свой вуз на карте?"
      - "Как сменить вуз?"
    keywords: [карта, выбрать, вуз, университет, сменить, другой]
    answer: >
      Откройте «Карту вузов» в холле, найдите вуз поиском или на карте, нажмите на метку и
      «Перейти в вуз». Выбор сохранится в профиле, и холл откроется уже для этого вуза. Вуз
      можно выбрать и прямо на экране входа (переключатель «Ваш вуз») или в профиле.
    links:
      - { label: "Карта вузов", route: "#/map" }

  - id: faculties
    questions:
      - "Где деканат моего факультета?"
      - "Как найти факультет и корпус?"
    keywords: [факультет, институт, корпус, этаж, кабинет, деканат, справка]
    answer: >
      В холле откройте «Факультеты и корпуса»: там поиск по названию и фильтр по корпусу,
      а у каждого факультета — кнопка «Показать на карте». Можно спросить и меня, например:
      «Где деканат экономического факультета?». Данные взяты с официальных сайтов вузов;
      если поле пустое, на сайте этих сведений нет.
    links:
      - { label: "Факультеты и корпуса", route: "#/faculties" }

  - id: history
    questions:
      - "Где история обращений?"
      - "Как посмотреть прошлые проверки?"
    keywords: [история, прошлые, обращения, мои, проверки]
    answer: >
      Раздел «История обращений» в холле показывает ваши прошлые проверки: дату, файл, тип
      документа и итог. История хранится на сервере приложения, сами файлы не сохраняются.
    links:
      - { label: "История обращений", route: "#/history" }

  - id: privacy
    questions:
      - "Куда отправляются мои документы?"
      - "Это безопасно?"
    keywords: [безопасность, приватность, данные, персональные, отправляются, облако]
    answer: >
      Документы распознаются локальной OCR-моделью на том же компьютере, где запущен сервис.
      Внешние OCR- и LLM-сервисы не используются, файлы на диск не сохраняются. Помощник
      тоже работает локально и отвечает только по справке, данным вузов и Положению.

  - id: badges
    questions:
      - "Что за значки?"
      - "Как получить значок?"
    keywords: [значок, значки, достижения, награда, геймификация]
    answer: >
      Значки выдаются за действия в путеводителе: вошли в холл, проверили документ, нашли
      деканат в справке, добежали до корпуса на карте, спросили помощника голосом, включили
      2FA. Все значки и подсказки, как получить остальные, — в профиле. Хранятся они только в
      этом браузере.
    links:
      - { label: "Профиль", route: "#/profile" }

  - id: my-data
    questions:
      - "Как удалить аккаунт?"
      - "Как скачать мои данные?"
      - "Как очистить историю обращений?"
    keywords: [удалить, аккаунт, скачать, выгрузить, данные, очистить, история]
    answer: >
      В профиле, блок «Мои данные»: «Скачать мои данные» выгрузит профиль и историю одним
      JSON-файлом, «Удалить аккаунт» удалит аккаунт вместе с историей (нужны пароль и, если
      включена, код 2FA). Историю отдельно можно очистить на странице «История обращений».
    links:
      - { label: "Профиль", route: "#/profile" }
      - { label: "История обращений", route: "#/history" }

  - id: voice
    questions:
      - "Как задать вопрос голосом?"
      - "Голосовой помощник"
    keywords: [голос, голосом, микрофон, озвучить, сказать]
    answer: >
      В окне помощника нажмите на микрофон и задайте вопрос вслух. Ответ можно прослушать
      кнопкой с динамиком. Озвучка идёт голосом вашей системы, распознавание — средствами
      браузера (если он поддерживает распознавание на устройстве, звук никуда не уходит).

  - id: install
    questions:
      - "Как установить приложение?"
      - "Есть ли мобильное приложение?"
    keywords: [установить, ярлык, рабочий стол, телефон, android, мобильное, pwa, офлайн]
    answer: >
      В Chrome, Edge или Яндекс Браузере нажмите «Установить» в адресной строке или в меню —
      приложение появится на рабочем столе и откроет справку и холл даже без сети. Для
      Android есть сборка через Capacitor (папка frontend/android).

  - id: decision
    questions:
      - "Кто принимает решение по документу?"
      - "Документ принят?"
    keywords: [решение, принят, одобрен, сотрудник]
    answer: >
      Сервис только предварительно проверяет комплектность. Окончательное решение о принятии
      документа принимает сотрудник деканата (п. 1.3 Положения).
    links:
      - { label: "п. 1.3 Положения", route: "#/dean?rule=1.3" }
