<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Академиум — онлайн-деканат: локальная предварительная проверка студенческих документов по Положению университета «Меридиан». Решение принимает сотрудник деканата."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0A1440" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Академиум" />
    <title>Академиум — онлайн-деканат и путеводитель по вузу</title>
    <script>
      // Тема ставится до первой отрисовки, чтобы страница не мигала светлым.
      try {
        var t = localStorage.getItem('umir-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
