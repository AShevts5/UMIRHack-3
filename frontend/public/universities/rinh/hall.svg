<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t">
<title id="t">Светлый холл главного корпуса: большие окна, гирлянда, растения, шарики и пост охраны (иллюстрация)</title>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9E8FF"/><stop offset=".55" stop-color="#F3F7FF"/><stop offset="1" stop-color="#FFF1DF"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FB2FF"/><stop offset=".7" stop-color="#A9DEFF"/><stop offset="1" stop-color="#E4F6FF"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6DDBA"/><stop offset="1" stop-color="#E9C08F"/></linearGradient>
<linearGradient id="rug" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B7BFF"/><stop offset="1" stop-color="#1D3FC4"/></linearGradient>
<linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE6FA"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6C9"/><stop offset=".55" stop-color="#FFD24A"/><stop offset="1" stop-color="#FFC233" stop-opacity="0"/></radialGradient>
<radialGradient id="beam" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#FFF7D6" stop-opacity=".75"/><stop offset="1" stop-color="#FFF7D6" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#B9CCF5" opacity=".55"/></pattern>
<path id="spark" d="M0-18C2-6 6-2 18 0C6 2 2 6 0 18C-2 6-6 2-18 0C-6-2-2-6 0-18Z"/>
</defs>

<!-- стена и потолок -->
<rect width="1600" height="1000" fill="url(#wall)"/>
<rect width="1600" height="760" fill="url(#dots)"/>
<rect width="1600" height="70" fill="#C7DAFF"/>
<rect y="70" width="1600" height="8" fill="#AFC8FA"/>
<circle cx="230" cy="470" r="210" fill="#FFFFFF" opacity=".55"/>
<circle cx="520" cy="300" r="120" fill="#E6EEFF" opacity=".7"/>

<!-- большое окно в центре: небо, солнце, облака -->
<g>
  <path d="M800 760V330a200 200 0 0 1 400 0v430z" fill="#FFFFFF"/>
  <path d="M820 740V335a180 180 0 0 1 360 0v405z" fill="url(#sky)"/>
  <circle cx="1080" cy="280" r="90" fill="url(#sun)"/>
  <circle cx="1080" cy="280" r="34" fill="#FFE07A"/>
  <g fill="#FFFFFF">
    <ellipse cx="900" cy="300" rx="52" ry="20"/><ellipse cx="935" cy="288" rx="34" ry="22"/><ellipse cx="872" cy="292" rx="24" ry="16"/>
    <ellipse cx="1110" cy="430" rx="60" ry="20" opacity=".9"/><ellipse cx="1140" cy="418" rx="34" ry="20" opacity=".9"/>
    <ellipse cx="930" cy="520" rx="44" ry="15" opacity=".8"/>
  </g>
  <path d="M960 360q8-8 16 0q8-8 16 0M1010 390q6-6 12 0q6-6 12 0" fill="none" stroke="#2A4C99" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="10">
    <path d="M1000 160v580M820 470h360M820 610h360"/>
  </g>
  <rect x="790" y="740" width="420" height="22" rx="8" fill="#FFFFFF"/>
</g>
<!-- лучи из окна на полу -->
<path d="M820 760L640 1000H1360L1180 760z" fill="url(#beam)" opacity=".7"/>

<!-- окна поменьше справа и слева -->
<g>
  <path d="M1280 700V420a90 90 0 0 1 180 0v280z" fill="#FFFFFF"/>
  <path d="M1294 688V424a76 76 0 0 1 152 0v264z" fill="url(#sky)"/>
  <ellipse cx="1350" cy="470" rx="34" ry="12" fill="#FFFFFF"/>
  <path d="M1370 350v338M1294 520h152" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M540 700V420a90 90 0 0 1 180 0v280z" fill="#FFFFFF"/>
  <path d="M554 688V424a76 76 0 0 1 152 0v264z" fill="url(#sky)"/>
  <ellipse cx="660" cy="500" rx="30" ry="11" fill="#FFFFFF"/>
  <path d="M630 350v338M554 520h152" stroke="#FFFFFF" stroke-width="8"/>
</g>

<!-- вывеска с приветствием -->
<g>
  <path d="M842 70L862 104M1158 70L1138 104" stroke="#8AA3D6" stroke-width="3"/>
  <rect x="790" y="100" width="420" height="58" rx="29" fill="#1E5BEA"/>
  <rect x="796" y="106" width="408" height="46" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
  <text x="985" y="138" text-anchor="middle" font-family="Onest, 'Golos Text', Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="2" fill="#FFFFFF">ДОБРО ПОЖАЛОВАТЬ!</text>
  <use href="#spark" transform="translate(1176 129) scale(.85)" fill="#FFC633"/>
</g>

<!-- гирлянда из флажков -->
<g>
  <path d="M0 96Q200 190 400 96" fill="none" stroke="#6F86C2" stroke-width="2.5"/>
  <path d="M400 96Q600 190 800 96" fill="none" stroke="#6F86C2" stroke-width="2.5"/>
  <path d="M1200 96Q1400 190 1600 96" fill="none" stroke="#6F86C2" stroke-width="2.5"/>
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round">
    <path d="M-17 0h34l-17 36z" fill="#2F6BFF" transform="translate(67 122) rotate(17)"/>
    <path d="M-17 0h34l-17 36z" fill="#FFC633" transform="translate(133 138) rotate(9)"/>
    <path d="M-17 0h34l-17 36z" fill="#FF7A6B" transform="translate(200 143) rotate(0)"/>
    <path d="M-17 0h34l-17 36z" fill="#35CFAE" transform="translate(267 138) rotate(-9)"/>
    <path d="M-17 0h34l-17 36z" fill="#8E6BFF" transform="translate(333 122) rotate(-17)"/>
    <path d="M-17 0h34l-17 36z" fill="#2F6BFF" transform="translate(467 122) rotate(17)"/>
    <path d="M-17 0h34l-17 36z" fill="#FFC633" transform="translate(533 138) rotate(9)"/>
    <path d="M-17 0h34l-17 36z" fill="#FF7A6B" transform="translate(600 143) rotate(0)"/>
    <path d="M-17 0h34l-17 36z" fill="#35CFAE" transform="translate(667 138) rotate(-9)"/>
    <path d="M-17 0h34l-17 36z" fill="#8E6BFF" transform="translate(733 122) rotate(-17)"/>
    <path d="M-17 0h34l-17 36z" fill="#2F6BFF" transform="translate(1267 122) rotate(17)"/>
    <path d="M-17 0h34l-17 36z" fill="#FFC633" transform="translate(1333 138) rotate(9)"/>
    <path d="M-17 0h34l-17 36z" fill="#FF7A6B" transform="translate(1400 143) rotate(0)"/>
    <path d="M-17 0h34l-17 36z" fill="#35CFAE" transform="translate(1467 138) rotate(-9)"/>
    <path d="M-17 0h34l-17 36z" fill="#8E6BFF" transform="translate(1533 122) rotate(-17)"/>
  </g>
</g>

<!-- подвесные лампы -->
<g>
  <circle cx="380" cy="300" r="90" fill="url(#lamp)"/>
  <path d="M380 70v170" stroke="#6F86C2" stroke-width="3"/>
  <path d="M340 270a40 34 0 0 1 80 0z" fill="#FFC633"/>
  <rect x="338" y="268" width="84" height="8" rx="4" fill="#E8A916"/>
  <circle cx="380" cy="284" r="9" fill="#FFF3C4"/>
  <circle cx="1530" cy="250" r="70" fill="url(#lamp)"/>
  <path d="M1530 70v130" stroke="#6F86C2" stroke-width="3"/>
  <path d="M1500 226a30 26 0 0 1 60 0z" fill="#2F6BFF"/>
  <rect x="1498" y="224" width="64" height="7" rx="3.5" fill="#1D3FC4"/>
  <circle cx="1530" cy="238" r="7" fill="#FFF3C4"/>
</g>

<!-- бумажный самолётик с пунктирным следом -->
<g>
  <path d="M90 300C170 230 250 380 330 300S470 210 520 236" fill="none" stroke="#2F6BFF" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".7"/>
  <g transform="translate(530 232) rotate(-14)">
    <path d="M0 0L58-20L36 22z" fill="#FFFFFF" stroke="#1E5BEA" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 0L36 22L28 2z" fill="#CFE0FF" stroke="#1E5BEA" stroke-width="3" stroke-linejoin="round"/>
    <path d="M28 2L58-20" stroke="#1E5BEA" stroke-width="3"/>
  </g>
</g>

<!-- пол и коврик со звездой -->
<rect y="760" width="1600" height="240" fill="url(#floor)"/>
<g stroke="#E2B47F" stroke-width="2" opacity=".7">
  <path d="M0 820H1600M0 890H1600M0 960H1600"/>
  <path d="M180 760v60M520 820v70M900 760v60M1260 820v70M300 890v70M760 890v70M1180 890v70M1500 760v60"/>
</g>
<ellipse cx="800" cy="900" rx="330" ry="70" fill="url(#rug)"/>
<ellipse cx="800" cy="900" rx="300" ry="56" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3" stroke-dasharray="10 10"/>
<use href="#spark" transform="translate(800 900) scale(2.2 .9)" fill="#FFC633"/>

<!-- шарики у поста охраны -->
<g>
  <path d="M1220 640C1210 560 1240 500 1214 420M1236 640C1250 560 1268 480 1288 400M1228 640C1228 560 1196 520 1170 470" fill="none" stroke="#8AA3D6" stroke-width="2"/>
  <ellipse cx="1214" cy="380" rx="34" ry="42" fill="#FF7A6B"/><path d="M1208 422l6 8 6-8z" fill="#FF7A6B"/>
  <ellipse cx="1290" cy="360" rx="34" ry="42" fill="#FFC633"/><path d="M1284 402l6 8 6-8z" fill="#FFC633"/>
  <ellipse cx="1166" cy="432" rx="30" ry="37" fill="#35CFAE"/><path d="M1160 469l6 8 6-8z" fill="#35CFAE"/>
  <g fill="#FFFFFF" opacity=".55"><ellipse cx="1202" cy="364" rx="8" ry="13"/><ellipse cx="1278" cy="344" rx="8" ry="13"/><ellipse cx="1156" cy="418" rx="7" ry="11"/></g>
</g>

<!-- пост охраны: стойка с лампой и табличкой -->
<g>
  <rect x="1060" y="640" width="330" height="140" rx="26" fill="url(#desk)" stroke="#B7C8EE" stroke-width="3"/>
  <rect x="1060" y="640" width="330" height="22" rx="11" fill="#2F6BFF"/>
  <rect x="1150" y="690" width="150" height="40" rx="20" fill="#E8F0FF" stroke="#2F6BFF" stroke-width="2"/>
  <text x="1225" y="717" text-anchor="middle" font-family="Onest, 'Golos Text', Arial, sans-serif" font-size="18" font-weight="700" fill="#1D3FC4">Пост охраны</text>
  <path d="M1350 640v-50l-26-20" fill="none" stroke="#1D3FC4" stroke-width="5" stroke-linecap="round"/>
  <path d="M1300 566l34-16 10 22-36 12z" fill="#FFC633"/>
  <path d="M1116 640v-26h44v26" fill="#35CFAE"/>
  <rect x="1110" y="606" width="56" height="10" rx="5" fill="#2BB596"/>
</g>

<!-- растения в горшках -->
<g>
  <path d="M60 760h120l-14 120H74z" fill="#FF7A6B"/>
  <rect x="52" y="748" width="136" height="20" rx="10" fill="#F05E50"/>
  <g fill="#2FB57F">
    <path d="M120 750C60 700 20 620 40 540C90 590 120 660 120 750z"/>
    <path d="M120 750C170 690 230 640 250 560C190 580 140 650 120 750z"/>
    <path d="M120 750C110 660 120 560 160 480C180 560 160 660 120 750z" fill="#3ACB8F"/>
    <path d="M120 750C80 680 70 600 92 520C120 590 130 670 120 750z" fill="#25996A"/>
  </g>
  <path d="M1460 760h100l-12 100h-76z" fill="#2F6BFF"/>
  <rect x="1452" y="748" width="116" height="18" rx="9" fill="#1D3FC4"/>
  <g fill="#2FB57F">
    <ellipse cx="1480" cy="690" rx="26" ry="62" transform="rotate(-24 1480 690)"/>
    <ellipse cx="1540" cy="684" rx="26" ry="64" transform="rotate(22 1540 684)"/>
    <ellipse cx="1510" cy="660" rx="24" ry="78" fill="#3ACB8F"/>
  </g>
</g>

<!-- искорки -->
<g fill="#FFC633">
  <use href="#spark" transform="translate(700 250) scale(.9)"/>
  <use href="#spark" transform="translate(250 200) scale(.6)"/>
  <use href="#spark" transform="translate(1440 330) scale(.7)"/>
  <use href="#spark" transform="translate(760 590) scale(.5)"/>
</g>
<g fill="#2F6BFF" opacity=".55">
  <use href="#spark" transform="translate(470 420) scale(.45)"/>
  <use href="#spark" transform="translate(1250 240) scale(.5)"/>
  <use href="#spark" transform="translate(60 420) scale(.5)"/>
</g>
</svg>
